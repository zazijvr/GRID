name: Build Android APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (For Tauri CLI underlying tools)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          bun install

      - name: Build APK (Release)
        run: |
          # Android projekt je v gitu (vlastní MainActivity / MediaPlaybackService) – init jen když chybí,
          # jinak by se vlastní kód přepsal šablonou
          [ -d src-tauri/gen/android ] || npx tauri android init
          npx tauri android build --apk

      - name: Sign Release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Stálý podpisový klíč ze secrets – jen tak se nová verze nainstaluje přes starou
          # (jiný podpis = Android aktualizaci odmítne, uživatel musí odinstalovat a přijde o playlist).
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            ALIAS="${KEY_ALIAS:-zvrgrid}"
          else
            echo "::warning::Chybí secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD – APK je podepsané DOČASNÝM klíčem a nepůjde nainstalovat jako aktualizace."
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            ALIAS=zazijvr
            keytool -genkey -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias "$ALIAS" \
              -dname "CN=ZazijVR GRID" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD"
          fi
          printf '%s' "$KEYSTORE_PASSWORD" > ks.pass

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS/zipalign -f -p 4 src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.jks --ks-key-alias "$ALIAS" --ks-pass file:ks.pass \
            --out zvr-grid-android-release.apk aligned.apk
          $BUILD_TOOLS/apksigner verify zvr-grid-android-release.apk
          rm -f release.jks ks.pass aligned.apk

      - name: Publikace zkompilované verze do Release složky
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: latest-build
          files: zvr-grid-android-release.apk
          prerelease: false
